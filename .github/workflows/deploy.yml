name: Build and Test SecureHerAI API

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: secureherai-api
        run: mvn clean compile -DskipTests

      - name: Run tests
        working-directory: secureherai-api
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: 
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver

      - name: Package application
        working-directory: secureherai-api
        run: mvn package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: secureherai-api
          path: secureherai-api/target/*.jar
          retention-days: 7

# Note: Render.com handles deployment automatically when you push to main.
# Configure your Render.com service to:
# 1. Connect to this GitHub repository
# 2. Set build command: cd secureherai-api && mvn clean package -DskipTests
# 3. Set start command: java -jar target/*.jar
# 4. Add environment variables:
#    - SPRING_DATASOURCE_URL (your Render PostgreSQL connection string)
#    - SPRING_DATASOURCE_USERNAME
#    - SPRING_DATASOURCE_PASSWORD
#    - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
#    - GOOGLE_APPLICATION_CREDENTIALS (path to service account JSON, or use GOOGLE_CLOUD_PROJECT with IAM)
#    - JWT_SECRET
#    - JWT_EXPIRATION
#    - MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
#    - OAUTH2_CLIENT_ID, OAUTH2_CLIENT_SECRET, etc.
